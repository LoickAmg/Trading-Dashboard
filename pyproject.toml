[project]
name = "trading-dashboard"
version = "0.1.0"
description = "Tableau de bord de suivi de portefeuille (simulé) et d'indicateurs techniques — pas un outil d'exécution de trades, pas un conseil financier."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mahouna" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
trading-dashboard = "trading_dashboard.main:cli"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
